name: Atualizar catálogo Ressignificar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o site publicado
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar catálogo do canal
        run: python scripts/sync_resignificar_catalog.py
      - name: Publicar apenas quando houver mudança
        run: |
          if git diff --quiet -- resignificar/catalog.json; then
            exit 0
          fi
          git config user.name "wavepromusic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resignificar/catalog.json
          git commit -m "Atualiza catálogo Ressignificar"
          git push
